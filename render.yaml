services:
  - type: web
    name: examhelper-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: MAX_SCREENSHOTS
        value: 50
      - key: MAX_FILE_SIZE_MB
        value: 80
      - key: STORAGE_DIR
        value: /opt/render/project/src/backend/uploads
      - key: WEB_DIR
        value: /opt/render/project/src/web-frontend
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_ARCHIVE_FOLDER
        value: examhelper/archive
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 5
