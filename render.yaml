services:
  - type: web
    name: examhelper-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install --prefix backend && npm install --prefix web-app && npm run build --prefix web-app
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MAX_SCREENSHOTS
        value: 50
      - key: MAX_FILE_SIZE_MB
        value: 80
      - key: WEB_DIR
        value: /opt/render/project/src/web-app/dist
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_TTL_HOURS
        value: 24
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_SCREENSHOT_FOLDER
        value: examhelper/screenshots
