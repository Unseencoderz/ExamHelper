<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamHelper Screenshot Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orbit orbit-a"></div>
    <div class="background-orbit orbit-b"></div>
    
    <nav class="top-nav">
      <div class="nav-brand">
        <i class="ph-fill ph-camera"></i>
        <span>ExamHelper</span>
      </div>
      <div class="nav-tabs" role="tablist" aria-label="Workspace views">
        <button class="nav-tab is-active" type="button" data-view="screenshots" title="Screenshots"><i class="ph ph-images"></i><span>Screenshots</span></button>
        <button class="nav-tab" type="button" data-view="snippets" title="Snippets"><i class="ph ph-text-aa"></i><span>Snippets</span></button>
        <button class="nav-tab" type="button" data-view="settings" title="Settings"><i class="ph ph-sliders-horizontal"></i><span>Settings</span></button>
      </div>
      <div class="nav-actions">
        <span id="status-pill" class="status-pill">Loading screenshots...</span>
      </div>
    </nav>

    <div class="page-shell">
      <main class="workspace">
        <section class="panel board-panel view-panel is-active" data-panel="screenshots">
          <div class="toolbar">
            <div class="toolbar-group">
              <span id="screenshot-count" class="toolbar-label">0</span>
              <span id="selection-count" class="toolbar-label">0</span>
            </div>
            
            <div class="toolbar-group prompt-options" id="prompt-list">
              <!-- Prompts injected here via JS -->
            </div>

            <div class="toolbar-group toolbar-actions">
              <button id="select-all-btn" class="button button-secondary icon-btn" type="button" title="Select All"><i class="ph ph-check-square"></i></button>
              <button id="clear-selection-btn" class="button button-ghost icon-btn" type="button" title="Clear Selection"><i class="ph ph-x"></i></button>
            </div>
          </div>

          <div class="bulk-bar">
            <button id="copy-selected-btn" class="button button-secondary" type="button" title="Copy Selected"><i class="ph ph-copy"></i> Copy</button>
            <button id="extract-selected-btn" class="button button-primary" type="button" title="Extract Text to Clipboard"><i class="ph ph-sparkle"></i> Extract</button>
            <button id="delete-selected-btn" class="button button-danger icon-btn" type="button" title="Delete Selected"><i class="ph ph-trash"></i></button>
          </div>

          <div id="screenshots-container" class="screenshots-container" aria-live="polite"></div>
        </section>

        <section class="panel board-panel view-panel" data-panel="snippets">
          <div class="panel-heading">
            <div>
              <h2>Snippets</h2>
              <p class="panel-caption">Create shortcuts that expand from the Windows background client.</p>
            </div>
          </div>

          <form id="snippet-form" class="snippet-form">
            <input id="snippet-id" type="hidden" />
            <label class="field">
              <span>Shortcut</span>
              <input id="snippet-shortcut" autocomplete="off" placeholder="/ty" maxlength="40" required />
            </label>
            <label class="field field-text">
              <span>Replacement text</span>
              <textarea id="snippet-text" rows="5" placeholder="Thank you!" maxlength="8000"></textarea>
            </label>
            <div class="form-actions">
              <button id="snippet-cancel-btn" class="button button-ghost" type="button">Cancel</button>
              <button class="button button-secondary" type="submit" data-save-mode="dedent"><i class="ph ph-text-align-left"></i> Dedent &amp; Save</button>
              <button class="button button-primary" type="submit" data-save-mode="exact"><i class="ph ph-floppy-disk"></i> Save</button>
            </div>
          </form>

          <div id="snippets-list" class="snippets-list" aria-live="polite"></div>
        </section>

        <section class="panel board-panel view-panel" data-panel="settings">
          <div class="panel-heading">
            <div>
              <h2>Settings</h2>
              <p class="panel-caption">Update the screenshot hotkey used by connected desktop clients.</p>
            </div>
          </div>

          <form id="settings-form" class="settings-form">
            <label class="field">
              <span>Screenshot hotkey</span>
              <select id="screenshot-hotkey">
                <option value="Win+Alt+C">Win + Alt + C</option>
                <option value="Ctrl+Shift+4">Ctrl + Shift + 4</option>
                <option value="Ctrl+Alt+S">Ctrl + Alt + S</option>
                <option value="Ctrl+Shift+S">Ctrl + Shift + S</option>
                <option value="Alt+Shift+X">Alt + Shift + X</option>
                <option value="Win+Shift+S">Win + Shift + S</option>
              </select>
            </label>
            <div class="form-actions">
              <button class="button button-primary" type="submit"><i class="ph ph-check"></i> Apply</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-label="Screenshot preview" hidden>
      <div class="image-modal-backdrop" data-modal-close></div>
      <div class="image-modal-panel">
        <button class="button button-secondary icon-btn image-modal-close" type="button" data-modal-close title="Close"><i class="ph ph-x"></i></button>
        <img id="modal-image" alt="" />
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
